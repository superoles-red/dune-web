name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No game data in the repository
        run: python3 tools/check_no_game_data.py
      - name: Python syntax
        run: python3 -m compileall -q tools web/py-src
      - name: Save compatibility tests
        run: node --test tests/saves/*.test.mjs
      - name: WASM emitter unit tests (external ROM/baseline are skipped)
        run: python3 -m unittest discover -s tests/wasm_emitter
      - name: WASM integration tests (external ROM/baseline are skipped)
        run: python3 -m unittest discover -s tests/wasm_integration
      - name: Z80 emitter unit tests (differential skips without the ROM)
        run: python3 -m unittest discover -s tests/wasm_z80
      - name: Ported input layer tests
        run: node --test 'tests/input/*.test.mjs'
      - name: Workspace contract (profile, runtime manifest, references)
        run: python3 tools/check_workspace.py

  wasm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.74"
      - name: Build runtime.wasm from the pinned MIT runtime
        run: python3 tools/wasm_runtime/build_runtime.py
      - name: Runtime module tests
        run: node --test 'tests/wasm_runtime/**/*.test.mjs'
      - name: Rebuilt runtime keeps the committed ABI and export contract
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          committed = json.loads(subprocess.check_output(["git", "show", "HEAD:runtime/wasm/manifest.json"]))
          rebuilt = json.loads(open("runtime/wasm/manifest.json").read())
          assert committed["abi"]["abi_hash"] == rebuilt["abi"]["abi_hash"], "ABI hash drifted"
          assert committed["exports"]["all"] == rebuilt["exports"]["all"], "export set drifted"
          assert rebuilt["wasm"]["deterministic"] is True, "link is not deterministic"
          print("ABI hash, export set and determinism match the committed runtime.wasm")
          PY
