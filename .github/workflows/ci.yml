name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No game data in the repository
        run: python3 tools/check_no_game_data.py
      - name: Python syntax
        run: python3 -m compileall -q tools web/py-src
      - name: Save compatibility tests
        run: node --test tests/saves/*.test.mjs
      - name: Workspace contract (profile, runtime manifest, references)
        run: python3 tools/check_workspace.py
